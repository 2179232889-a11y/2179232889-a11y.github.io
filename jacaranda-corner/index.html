<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>悉尼蓝花楹街角</title>
  <style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  min-height: 100%;
  height: 100%;
  background: #f4f1eb;
  color: #2b2926;
  font-family: "Songti SC", "Noto Serif SC", "STSong", "PingFang SC", serif;
  overscroll-behavior: none;
}

body {
  min-height: 100dvh;
}

.page {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 48px 32px;
  gap: 0;
}

header {
  width: min(960px, 100%);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  margin-bottom: 28px;
  flex-shrink: 0;
}

.eyebrow {
  font-family: Inter, -apple-system, "Helvetica Neue", sans-serif;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.22em;
  color: #9a948c;
  margin-bottom: 8px;
}

h1 {
  font-size: 26px;
  font-weight: 500;
  letter-spacing: 0.28em;
  line-height: 1;
  text-indent: 0.28em;
}

.times {
  display: flex;
  gap: 28px;
  padding-bottom: 2px;
}

.times button {
  appearance: none;
  border: 0;
  background: none;
  padding: 0 0 6px;
  font-family: "Songti SC", "Noto Serif SC", "STSong", "PingFang SC", serif;
  font-size: 14px;
  letter-spacing: 0.16em;
  color: #b0aaa3;
  cursor: pointer;
  border-bottom: 1px solid transparent;
  transition: color 0.25s ease, border-color 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}

.times button:hover {
  color: #5c574f;
}

.times button.is-active {
  color: #2b2926;
  border-bottom-color: #2b2926;
}

.stage {
  width: min(960px, 100%);
  aspect-ratio: 3 / 2;
  background: #ece8e1;
  border-radius: 2px;
  overflow: hidden;
  position: relative;
  touch-action: none;
}

.stage canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

footer {
  width: min(960px, 100%);
  margin-top: 18px;
  flex-shrink: 0;
}

footer p {
  font-family: Inter, -apple-system, "Helvetica Neue", sans-serif;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: #b0aaa3;
  text-align: right;
}

@media (max-width: 720px) {
  .page {
    padding: max(20px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    justify-content: flex-start;
    height: 100dvh;
    min-height: 100dvh;
  }

  header {
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 20px;
    letter-spacing: 0.2em;
  }

  .times {
    width: 100%;
    justify-content: space-between;
    gap: 8px;
  }

  .times button {
    font-size: 15px;
    padding: 10px 4px 8px;
    min-height: 44px;
  }

  .stage {
    flex: 1;
    aspect-ratio: auto;
    width: 100%;
    min-height: 0;
  }

  footer {
    margin-top: 12px;
  }

  footer p {
    text-align: left;
  }
}

  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="titles">
        <p class="eyebrow">SYDNEY · JACARANDA CORNER</p>
        <h1>蓝花楹街角</h1>
      </div>
      <nav class="times" aria-label="时段切换">
        <button type="button" data-time="day" class="is-active">白天</button>
        <button type="button" data-time="dusk">黄昏</button>
        <button type="button" data-time="night">夜晚</button>
      </nav>
    </header>
    <main class="stage">
      <canvas id="scene"></canvas>
    </main>
    <footer>
      <p>拖拽旋转 · 滚轮缩放</p>
    </footer>
  </div>
